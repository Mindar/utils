global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: /probe
    params:
      module: [postgres]

  - job_name: 'valkey'
    static_configs:
      - targets: ['valkey:6379']

  - job_name: 'lldap'
    static_configs:
      - targets: ['lldap:17170']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']
