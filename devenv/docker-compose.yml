services:
  # Core Infrastructure
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: devenv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devenv
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - devenv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d devenv"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: devenv-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init-scripts/clickhouse:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native protocol
    networks:
      - devenv
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  valkey:
    image: valkey/valkey:latest
    container_name: devenv-valkey
    restart: unless-stopped
    command: valkey-server --requirepass admin
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    networks:
      - devenv
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "admin", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  # Identity Management
  lldap:
    image: lldap/lldap:latest
    container_name: devenv-lldap
    restart: unless-stopped
    environment:
      LLDAP_JWT_SECRET: "REPLACE_WITH_RANDOM_JWT_SECRET_MIN_12_CHARS"
      LLDAP_LDAP_USER_PASS: password
      LLDAP_LDAP_BASE_DN: dc=local,dc=aal,dc=sh
      LLDAP_DATABASE_URL: "postgres://admin:admin@postgres/lldap?sslmode=disable"
      LLDAP_VERBOSE: "true"
    ports:
      - "3890:3890"   # LDAP port
      - "17170:17170" # Web UI
    networks:
      - devenv
    depends_on:
      postgres:
        condition: service_healthy

  # Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: devenv-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.aal.sh
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - devenv
    depends_on:
      postgres:
        condition: service_healthy

  # Valkey Management
  redisinsight:
    image: redis/redisinsight:latest
    container_name: devenv-redisinsight
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    ports:
      - "5540:5540"
    networks:
      - devenv
    depends_on:
      - valkey

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: devenv-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - devenv

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: devenv-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # Jaeger HTTP receiver
      - "14250:14250"  # gRPC receiver
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - devenv

  loki:
    image: grafana/loki:latest
    container_name: devenv-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - devenv

  promtail:
    image: grafana/promtail:latest
    container_name: devenv-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./config/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - devenv
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: devenv-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./config/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./config/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - devenv
    depends_on:
      - prometheus
      - loki
      - jaeger

  # Email Testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: devenv-mailpit
    restart: unless-stopped
    environment:
      MP_DATA_FILE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - devenv

  # Langfuse - LLM Observability Platform
  minio:
    image: minio/minio:latest
    container_name: devenv-minio
    restart: unless-stopped
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data
    ports:
      - "9200:9000"   # S3 API
      - "9201:9001"   # Web UI
    networks:
      - devenv
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: devenv-langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/langfuse
      SALT: eef4c2f9a8b3d5e6c1a7f0b2d4e8c9a3f5b7d1e6c0a2f4
      ENCRYPTION_KEY: a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: admin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: password
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: admin
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: password
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9200
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_AUTH: admin
    networks:
      - devenv

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: devenv-langfuse-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-worker:
        condition: service_started
    ports:
      - "3050:3000"
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3050
      NEXTAUTH_SECRET: mysupersecretnextauthkey12345678901234567890
      SALT: eef4c2f9a8b3d5e6c1a7f0b2d4e8c9a3f5b7d1e6c0a2f4
      ENCRYPTION_KEY: a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: admin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: password
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: admin
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: password
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9200
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_AUTH: admin
      LANGFUSE_INIT_ORG_ID: devenv-org
      LANGFUSE_INIT_ORG_NAME: "DevEnv Organization"
      LANGFUSE_INIT_PROJECT_ID: devenv-project
      LANGFUSE_INIT_PROJECT_NAME: "DevEnv Project"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-dev-0000000000000000
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-dev-00000000000000000000000000000000
      LANGFUSE_INIT_USER_EMAIL: admin@local.aal.sh
      LANGFUSE_INIT_USER_NAME: "Admin User"
      LANGFUSE_INIT_USER_PASSWORD: password
    networks:
      - devenv

  # DevEnv Dashboard WebApp
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: devenv-dashboard
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
      - COMPOSE_PROJECT_NAME=devenv
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devenv
    depends_on:
      - postgres
      - clickhouse
      - valkey
      - lldap
      - prometheus
      - jaeger
      - grafana
      - mailpit
      - loki
      - langfuse-web

networks:
  devenv:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
  valkey_data:
  prometheus_data:
  grafana_data:
  loki_data:
  mailpit_data:
  pgadmin_data:
  redisinsight_data:
  minio_data:
